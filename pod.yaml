apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: default           # Namespace mà Pod chạy, nếu không ghi thì là default
  labels:
    app: nginx                 # Label để Service/Deployment chọn Pod
    env: production
spec:
  containers:
  - name: nginx                # Tên container (có thể đặt tùy ý)
    image: nginx:1.27-alpine   # Image Docker sẽ được pull
    imagePullPolicy: IfNotPresent  # Chỉ pull nếu chưa có local
    ports:
    - containerPort: 80        # Port mà container lắng nghe bên trong
    env:                       # Biến môi trường truyền vào container
    - name: ENV
      value: "production"
    resources:                 # Giới hạn tài nguyên CPU & RAM
      requests:                # Tài nguyên tối thiểu yêu cầu
        memory: "64Mi"
        cpu: "250m"            # 0.25 core
      limits:                  # Giới hạn tối đa (hard limit)
        memory: "128Mi"
        cpu: "500m"            # 0.5 core
    volumeMounts:              # Gắn volume vào container (nếu có)
    - name: data
      mountPath: /usr/share/nginx/html
  volumes:                     # Khai báo volume (ở đây ví dụ emptyDir)
  - name: data
    emptyDir: {}
